<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智能头盔对话</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Microsoft YaHei", sans-serif; background: #eef1f4; color: #1f2933; }
    .app { max-width: 480px; height: 100vh; margin: 0 auto; background: #f8fafc; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    header { position: sticky; top: 0; z-index: 3; background: #ffffff; border-bottom: 1px solid #e3e8ef; padding: 8px 12px; }
    body.hide-nav header { display: none; }
    .header-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
    .client-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #52616f; font-size: 13px; font-weight: 700; }
    .menu { display: flex; justify-content: flex-end; gap: 14px; flex: 0 0 auto; }
    .menu a { color: #2764d8; font-size: 14px; text-decoration: none; }
    .messages { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; scroll-behavior: smooth; }
    .message { display: flex; gap: 8px; margin: 10px 0; align-items: flex-start; }
    .message.agent { justify-content: flex-start; }
    .message.device { justify-content: flex-end; }
    .message.system { justify-content: center; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 14px; overflow: hidden; }
    .agent .avatar { background: #fff; border: 1px solid #d4dde8; }
    .agent .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .device .avatar { background: #315c99; order: 2; }
    .bubble { max-width: 72%; border-radius: 8px; padding: 10px 12px; line-height: 1.5; word-break: break-word; position: relative; font-size: 15px; white-space: pre-wrap; }
    .agent .bubble { background: #ffffff; border: 1px solid #dce4ea; }
    .device .bubble { background: #dcecff; color: #122b45; }
    .agent .bubble::before { content: ""; position: absolute; left: -7px; top: 13px; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-right: 7px solid #dce4ea; }
    .agent .bubble::after { content: ""; position: absolute; left: -6px; top: 14px; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 6px solid #ffffff; }
    .device .bubble::after { content: ""; position: absolute; right: -6px; top: 13px; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 6px solid #dcecff; }
    .system .bubble { background: #fff7d6; color: #5d4a00; max-width: 90%; font-size: 13px; }
    .thought-card { max-width: 78%; background: #f2f5f8; border: 1px solid #d8e0e8; color: #4a5968; border-radius: 8px; padding: 8px 10px; line-height: 1.45; position: relative; font-size: 13px; }
    .thought-card::before { content: ""; position: absolute; left: -7px; top: 13px; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-right: 7px solid #d8e0e8; }
    .thought-card::after { content: ""; position: absolute; left: -6px; top: 14px; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 6px solid #f2f5f8; }
    .thought-title { margin-bottom: 4px; color: #667789; font-size: 12px; font-weight: 700; }
    .thought-body { white-space: pre-wrap; word-break: break-word; }
    .agent .bubble.hazard-bubble { background: #fff8e6; border-color: #e0a829; border-left: 4px solid #d88a00; color: #3b2a05; font-weight: 500; box-shadow: 0 2px 10px rgba(216, 138, 0, .14); }
    .agent .bubble.hazard-bubble::after { border-right-color: #fff8e6; }
    .thought-card.analysis-card { background: #fff8e6; border-color: #e0a829; border-left: 4px solid #d88a00; color: #3b2a05; box-shadow: 0 2px 10px rgba(216, 138, 0, .14); }
    .thought-card.analysis-card::before { border-right-color: #e0a829; }
    .thought-card.analysis-card::after { border-right-color: #fff8e6; }
    .analysis-card .thought-title { color: #9a5a00; font-size: 13px; font-weight: 700; }
    .analysis-card .thought-body { font-size: 14px; line-height: 1.7; }
    .card { max-width: 82%; background: #fff; border: 1px solid #dce4ea; border-radius: 8px; padding: 10px; line-height: 1.5; position: relative; }
    .agent .card::before { content: ""; position: absolute; left: -7px; top: 13px; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-right: 7px solid #dce4ea; }
    .agent .card::after { content: ""; position: absolute; left: -6px; top: 14px; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 6px solid #ffffff; }
    .device .card { background: #dcecff; border-color: #c8def8; }
    .device .card::after { content: ""; position: absolute; right: -6px; top: 13px; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 6px solid #dcecff; }
    .card img { max-width: 100%; border-radius: 6px; display: block; }
    .card h3 { margin: 0 0 8px; font-size: 15px; }
    .card p { margin: 8px 0 0; }
    .card ul { margin: 8px 0 0; padding-left: 18px; }
    footer { border-top: 1px solid #e3e8ef; background: #fff; padding: 8px 12px; font-size: 12px; color: #52616f; min-height: 32px; }
    .scroll-bottom { position: fixed; right: calc(50% - 224px); bottom: 72px; width: 42px; height: 42px; border-radius: 50%; border: 1px solid #cbd5df; background: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.18); font-size: 22px; display: none; }
    .scroll-bottom.unread::after { content: ""; position: absolute; right: 5px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: #d92d20; }
    @media (max-width: 520px) { .scroll-bottom { right: 16px; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="header-row">
        <div class="client-label" id="clientLabel"></div>
        <nav class="menu"></nav>
      </div>
    </header>
    <section class="messages" id="messages"></section>
    <button class="scroll-bottom" id="scrollBottom" title="滚动到底部">↓</button>
    <footer id="footer"></footer>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    let sn = params.get("sn") || pathSn() || "";
    const forceAutoScroll = params.get("autoscroll") === "1";
    const messages = document.getElementById("messages");
    const footer = document.getElementById("footer");
    const scrollBtn = document.getElementById("scrollBottom");
    const clientLabel = document.getElementById("clientLabel");
    const historyLink = document.getElementById("historyLink");
    const agentBubbles = new Map();
    const thoughtBodies = new Map();
    let ws = null;
    let unread = false;
    let stickToBottom = true;

    function pathSn() {
      const match = location.pathname.match(/^\/client\/([^/?#]+)/);
      if (!match) return "";
      try {
        return decodeURIComponent(match[1]);
      } catch (_) {
        return match[1];
      }
    }

    function atBottom() {
      return messages.scrollHeight - messages.scrollTop - messages.clientHeight < 60;
    }
    function updateScrollButton() {
      const show = !atBottom();
      scrollBtn.style.display = show ? "block" : "none";
      scrollBtn.classList.toggle("unread", unread && show);
    }
    function keepScroll() {
      if (forceAutoScroll || stickToBottom) {
        requestAnimationFrame(() => {
          messages.scrollTop = messages.scrollHeight;
          if (forceAutoScroll && document.scrollingElement) {
            document.scrollingElement.scrollTop = document.scrollingElement.scrollHeight;
          }
          unread = false;
          updateScrollButton();
        });
      } else {
        unread = true;
        updateScrollButton();
      }
    }
    scrollBtn.onclick = () => { stickToBottom = true; messages.scrollTop = messages.scrollHeight; unread = false; updateScrollButton(); };
    messages.addEventListener("scroll", () => {
      stickToBottom = atBottom();
      if (stickToBottom) unread = false;
      updateScrollButton();
    });

    function avatar(role) {
      const el = document.createElement("div");
      el.className = "avatar";
      if (role === "agent") {
        const img = document.createElement("img");
        img.src = "/static/logo-reset.png";
        img.alt = "agent";
        img.onerror = () => { img.remove(); el.textContent = "AI"; el.style.background = "#1f7a5b"; };
        el.append(img);
      } else {
        el.textContent = "员";
      }
      return el;
    }
    function addBubble(role, text, id) {
      const row = document.createElement("div");
      row.className = `message ${role}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (id === "agent-hazard-summary") bubble.classList.add("hazard-bubble");
      bubble.textContent = text || "";
      if (role === "agent") row.append(avatar("agent"));
      row.append(bubble);
      if (role === "device") row.append(avatar("device"));
      messages.append(row);
      if (id) agentBubbles.set(id, bubble);
      keepScroll();
      return bubble;
    }
    function addCard(role, html) {
      const row = document.createElement("div");
      row.className = `message ${role}`;
      if (role === "agent") row.append(avatar("agent"));
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = html;
      row.append(card);
      if (role === "device") row.append(avatar("device"));
      messages.append(row);
      keepScroll();
    }
    function addThought(id) {
      const row = document.createElement("div");
      row.className = "message agent";
      row.append(avatar("agent"));
      const card = document.createElement("div");
      card.className = "thought-card";
      if (id === "llm-stream-analysis") card.classList.add("analysis-card");
      const title = document.createElement("div");
      title.className = "thought-title";
      title.textContent = thoughtTitle(id);
      const body = document.createElement("div");
      body.className = "thought-body";
      card.append(title, body);
      row.append(card);
      messages.append(row);
      if (id) thoughtBodies.set(id, body);
      keepScroll();
      return body;
    }
    function thoughtTitle(id) {
      return id === "llm-stream-analysis" ? "分析" : "思考";
    }
    function handle(event) {
      if (event.type === "demo_step") {
        if (event.image_url) {
          const imageRole = event.image_role === "device" ? "device" : "agent";
          addCard(imageRole, `<h3>${event.title || "现场图片"}</h3><img src="${event.image_url}" alt="${event.title || "现场图片"}"><p>${event.text || ""}</p>`);
        }
        return;
      } else if (event.type === "device_status" || event.type === "file_uploaded" || event.type === "agent_status") {
        return;
      } else if (event.type === "asr_result") {
        addBubble("device", event.text, event.message_id);
      } else if (event.type === "agent_start") {
        addBubble("agent", "", event.message_id);
      } else if (event.type === "agent_delta") {
        const bubble = agentBubbles.get(event.message_id) || addBubble("agent", "", event.message_id);
        bubble.textContent += event.content || "";
        keepScroll();
      } else if (event.type === "agent_thought_start") {
        addThought(event.message_id);
      } else if (event.type === "agent_thought_delta") {
        const body = thoughtBodies.get(event.message_id) || addThought(event.message_id);
        body.textContent += event.content || "";
        keepScroll();
      } else if (event.type === "agent_thought_done") {
        keepScroll();
      } else if (event.type === "local_flow_result") {
        addCard("agent", `<h3>${event.title}</h3><ul>${(event.items || []).map(x => `<li>${x}</li>`).join("")}</ul>`);
      } else if (event.type === "device_image") {
        addCard("device", `<h3>现场图片</h3><img src="${event.url || "/api/files/" + event.file}" alt="现场图片"><p>${event.file || ""}</p>`);
      } else if (event.type === "invalid_image_scene" || event.type === "poor_image_quality") {
        addBubble("system", event.message || "图片无法分析，请重新拍摄。");
      } else if (event.type === "asr_failed" || event.type === "system_error" || event.type === "system_warning" || event.type === "tts_failed" || event.type === "duplicate_ignored") {
        addBubble("system", event.message || "系统提示");
      } else if (event.type && event.type.startsWith("tts")) {
        footer.textContent = `TTS 状态：${event.type}`;
      }
    }

    function connectWebSocket() {
      const encodedSn = encodeURIComponent(sn);
      clientLabel.textContent = `客户端：${sn}`;
     //historyLink.href = `/history?sn=${encodedSn}`;
      footer.textContent = `客户端：${sn}`;
      localStorage.setItem("helmet_last_sn", sn);

      ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/web/${encodedSn}?replay=0`);
      ws.onmessage = e => handle(JSON.parse(e.data));
      ws.onclose = () => { footer.textContent = `客户端：${sn}，连接已断开，请刷新页面。`; };
    }

    function parseVisible(value) {
      return !["0", "false", "no", "off", "hide", "hidden"].includes(String(value || "").toLowerCase());
    }
    function setNavVisible(visible) {
      document.body.classList.toggle("hide-nav", !visible);
    }
    async function loadWebConfig() {
      try {
        const resp = await fetch("/api/web-config");
        return resp.ok ? await resp.json() : { web_nav_visible: true };
      } catch (_) {
        return { web_nav_visible: true };
      }
    }

    async function init() {
      const config = await loadWebConfig();
      if (!sn) {
        sn = localStorage.getItem("helmet_last_sn") || config.default_sn || "rv1126b";
      }

      const navParam = params.get("nav");
      if (navParam !== null) {
        setNavVisible(parseVisible(navParam));
      } else {
        setNavVisible(config.web_nav_visible !== false);
      }

      connectWebSocket();
    }

    init();
  </script>
</body>
</html>
